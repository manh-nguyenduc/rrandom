<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>rrandom</title>
<meta name="description" content="Generate secure passwords, API keys, passphrases, UUIDs, NanoIDs and current user agents in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..500&display=swap" media="print" id="gf">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..500&display=swap"></noscript>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 2h22v28H8L2 24V8z' fill='%23FFD23F'/%3E%3Ccircle cx='9' cy='16' r='3' fill='%23131A36'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#E6E9F0; --panel:#F4F5F9; --ink:#131A36; --muted:#5A6283; --line:#C7CDDC; --edge:#78819D;
  --cobalt:#2D47F0; --cobalt-ink:#FFFFFF; --tag:#FFD23F; --tag-ink:#131A36; --tag-shade:#E8B91C;
  --weak:#D8432F; --fair:#A87200; --ok:#1F8A5B;
  --sans:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1430; --panel:#171E42; --ink:#E9ECF8; --muted:#9AA3C7; --line:#2C3566; --edge:#5F6BA5;
    --cobalt:#8EA0FF; --cobalt-ink:#0F1430; --weak:#FF8A75; --fair:#F2B544; --ok:#5FD6A0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1430; --panel:#171E42; --ink:#E9ECF8; --muted:#9AA3C7; --line:#2C3566; --edge:#5F6BA5;
  --cobalt:#8EA0FF; --cobalt-ink:#0F1430; --weak:#FF8A75; --fair:#F2B544; --ok:#5FD6A0; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);
  font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

.shell{max-width:1120px;margin:0 auto;padding:28px 24px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:36px}
.mark{font-weight:800;font-size:clamp(40px,6vw,64px);line-height:.9;letter-spacing:-.045em;margin:0}
.mark a{color:inherit;text-decoration:none;border-radius:6px}
.mark a:hover span{transform:translateY(.06em) rotate(8deg)}
.mark span{transition:transform .2s ease;display:inline-block;transform:translateY(.06em) rotate(-8deg);color:var(--cobalt)}
.lede{margin:10px 0 0;color:var(--muted);max-width:46ch}
.theme{border:1px solid var(--edge);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;align-items:start}
.layout>*{min-width:0}
nav{position:sticky;top:24px;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:block;padding:10px 14px 11px;border-radius:10px;position:relative}
nav button b{display:block;font-weight:600;font-size:17px;letter-spacing:-.01em}
nav button small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
nav button:hover{background:var(--panel)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
nav button[aria-selected="true"] small{color:inherit;opacity:.7}
nav button[aria-selected="true"]::before{content:"";position:absolute;left:-10px;top:50%;width:6px;height:6px;
  margin-top:-3px;border-radius:50%;background:var(--tag)}
nav button:focus-visible{outline:2px solid var(--cobalt)}

main h2{font-weight:700;font-size:clamp(28px,3.4vw,38px);letter-spacing:-.03em;line-height:1.05;margin:0 0 6px}
main .about{color:var(--muted);margin:0 0 22px;max-width:60ch}

/* the key tag */
.tag{position:relative;background:var(--tag);color:var(--tag-ink);
  --cut:24px;border-radius:0 18px 18px 0;
  -webkit-mask:linear-gradient(135deg,transparent var(--cut),#000 0) top left/51% 51% no-repeat,linear-gradient(45deg,transparent var(--cut),#000 0) bottom left/51% 51% no-repeat,linear-gradient(#000,#000) right/50% 100% no-repeat;
          mask:linear-gradient(135deg,transparent var(--cut),#000 0) top left/51% 51% no-repeat,linear-gradient(45deg,transparent var(--cut),#000 0) bottom left/51% 51% no-repeat,linear-gradient(#000,#000) right/50% 100% no-repeat;padding:30px 30px 30px 78px;min-height:132px;display:flex;align-items:center}
.tag::before{content:"";position:absolute;left:26px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;
  background:var(--paper);box-shadow:inset 0 0 0 4px var(--tag-shade)}
.value{font-family:var(--mono);font-weight:500;font-size:clamp(20px,2.9vw,34px);line-height:1.35;letter-spacing:0;
  overflow-wrap:anywhere;white-space:pre-wrap;margin:0;width:100%;user-select:all;font-variant-ligatures:none}
.value.long{font-size:clamp(15px,1.9vw,21px)}
.value.xlong{font-size:clamp(13px,1.4vw,16px);line-height:1.55}
.value.err{font-family:var(--sans);font-size:18px;user-select:auto;word-break:normal}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}
.btn{border:1px solid var(--edge);background:var(--panel);border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[hidden]{display:none}

.meter{display:flex;align-items:center;gap:14px;margin:22px 0 0;flex-wrap:wrap}
.bars{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:180px;flex:none}
.bars i{height:8px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--ink)}
.meter[data-level="weak"] .bars i.on{background:var(--weak)}
.meter[data-level="fair"] .bars i.on{background:var(--fair)}
.meter[data-level="strong"] .bars i.on{background:var(--ok)}
.bars i{transition:background-color .2s}
.meter p{margin:0;color:var(--muted);font-size:15px}
.meter p strong{color:var(--ink);font-weight:600}

.opts{margin:30px 0 0;padding:24px 0 0;border-top:1px solid var(--line);display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 28px}
.f{display:flex;flex-direction:column;gap:8px;min-width:0}
.f[hidden]{display:none}
.f>label,.f>.l{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.f>label output{font-family:var(--mono);font-weight:400;font-size:14px;color:var(--muted)}
.f input[type=range]{width:100%;accent-color:var(--cobalt);margin:4px 0}
.f select,.f input[type=text]{width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:9px 12px}
.f input[type=text]{font-family:var(--mono);font-size:14px}
.f select:focus,.f input[type=text]:focus{border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 25%,transparent)}
.f.wide{grid-column:1/-1}
.f textarea{width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;resize:vertical;font:400 15px/1.5 var(--sans);min-height:120px}
.f textarea:focus{border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 25%,transparent)}
nav .grp{display:block;color:var(--muted);font-size:13px;padding:14px 14px 4px}
nav .grp:first-child{padding-top:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
/* selection marker: a key-tag hole that becomes a yellow tag dot with a drawn tick */
.mk{flex:none;position:relative;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--edge);
  transition:background-color .16s ease,box-shadow .16s ease}
.mk svg{position:absolute;inset:0;width:16px;height:16px;fill:none;stroke:var(--tag-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:12;stroke-dashoffset:12;transition:stroke-dashoffset .22s ease .04s}
input:checked+span .mk{background:var(--tag);box-shadow:inset 0 0 0 1px var(--tag-shade)}
input:checked+span .mk svg{stroke-dashoffset:0}

.chk{position:relative}
.chk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chk span{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 7px;border:1px solid var(--edge);border-radius:999px;
  font-size:14px;color:var(--muted);background:transparent;transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}
.chk:hover span{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 55%,var(--edge))}
.chk input:checked+span{color:var(--ink);background:var(--panel);border-color:var(--ink);font-weight:600;box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 12%,transparent)}
.chk input:focus-visible+span{outline:2px solid var(--cobalt);outline-offset:2px}

.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.sty{position:relative;display:flex}
.sty input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sty span{position:relative;flex:1;display:flex;flex-direction:column;gap:4px;padding:11px 38px 12px 13px;border:1px solid var(--edge);border-radius:12px;
  background:transparent;transition:background-color .16s ease,border-color .16s ease,box-shadow .16s ease}
.sty .mk{position:absolute;top:12px;right:12px}
.sty b{font-weight:600;font-size:15px}
.sty code{font:400 12px/1.4 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sty small{font-size:13px;line-height:1.35;color:var(--muted)}
.sty:hover span{border-color:color-mix(in srgb,var(--ink) 55%,var(--edge))}
.sty input:checked+span{background:var(--panel);border-color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 10%,transparent),0 6px 18px -10px color-mix(in srgb,var(--ink) 35%,transparent)}
.sty input:checked+span code{color:var(--ink)}
.sty input:focus-visible+span{outline:2px solid var(--cobalt);outline-offset:2px}
@media (max-width:860px){.styles{grid-template-columns:1fr 1fr}}
.list{margin:28px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.list li{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:9px 0}
.list code{flex:1;min-width:0;font:400 14px/1.5 var(--mono);word-break:break-all;white-space:pre-wrap}
.list button{border:0;background:transparent;color:var(--cobalt);font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 -18px;color:var(--muted);font-size:15px}

.yours{margin:28px 0 0;padding:16px 18px;background:var(--panel);border-radius:12px;font-size:14px}
.yours p{margin:0 0 6px;color:var(--muted)}
.yours .row{display:flex;gap:12px;align-items:center}
.yours .row code{flex:1;min-width:0}
.yours button{border:0;background:transparent;color:var(--cobalt);font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px}
.yours .gap{margin-top:14px}
.yours code{font:400 13px/1.5 var(--mono);word-break:break-all}

footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer p{margin:0}
kbd{font:500 12px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel);color:var(--ink)}
footer a{color:inherit}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;transition:.18s ease;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .shell{padding:20px 16px 40px}
  header{margin-bottom:22px}
  .layout{grid-template-columns:minmax(0,1fr);gap:20px}
  nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:none;padding:8px 14px;border:1px solid var(--edge);border-radius:999px}
  nav button b{font-size:15px}
  nav button small{display:none}
  nav button[aria-selected="true"]{border-color:var(--ink)}
  nav button[aria-selected="true"]::before{display:none}
  nav .grp{display:none}
  .tag{padding:24px 18px 24px 62px;min-height:110px;--cut:18px}
  .tag::before{left:20px;width:18px;height:18px;margin-top:-9px}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1 class="mark"><a href="./" id="home" aria-label="rrandom, go to home">rrand<span>o</span>m</a></h1>
      <p class="lede">Passwords, keys and IDs made with your browser's cryptographic random generator. Nothing you generate leaves this page.</p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Toggle dark mode">Dark</button>
  </header>

  <div class="layout">
    <nav id="nav" role="tablist" aria-label="Generators"></nav>
    <main id="main"><div id="panel" role="tabpanel" tabindex="-1">
      <h2 id="title"></h2>
      <p class="about" id="about"></p>
      <div class="tag"><p class="value" id="value"></p></div><p class="sr-only" id="live" aria-live="polite"></p>
      <div class="actions">
        <button class="btn primary" id="gen" type="button">Generate</button>
        <button class="btn" id="copy" type="button">Copy</button>
        <button class="btn" id="copyAll" type="button" hidden>Copy all</button>
        <button class="btn" id="download" type="button" hidden>Download .txt</button>
      </div>
      <div class="meter" id="meter"><div class="bars" id="bars"></div><p id="meterText"></p></div>
      <form class="opts" id="opts"></form>
      <div id="extra"></div>
    </div></main>
  </div>

  <footer>
    <p>Press <kbd>G</kbd> to generate, <kbd>C</kbd> to copy.</p>
    <p>Passphrase words from the <a href="https://www.eff.org/dice" rel="noopener">EFF wordlist</a>.</p>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
