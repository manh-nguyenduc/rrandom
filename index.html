<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rrandom</title>
<meta name="description" content="Generate secure passwords, API keys, passphrases, UUIDs, NanoIDs and current user agents in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..500&display=swap"></noscript>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 2h22v28H8L2 24V8z' fill='%23FFD23F'/%3E%3Ccircle cx='9' cy='16' r='3' fill='%23131A36'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#E6E9F0; --panel:#F4F5F9; --ink:#131A36; --muted:#5A6283; --line:#C7CDDC; --edge:#78819D;
  --cobalt:#2D47F0; --cobalt-ink:#FFFFFF; --tag:#FFD23F; --tag-ink:#131A36; --tag-shade:#E8B91C;
  --weak:#D8432F; --fair:#A87200; --ok:#1F8A5B;
  --sans:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1430; --panel:#171E42; --ink:#E9ECF8; --muted:#9AA3C7; --line:#2C3566; --edge:#5F6BA5;
    --cobalt:#8EA0FF; --cobalt-ink:#0F1430; --weak:#FF8A75; --fair:#F2B544; --ok:#5FD6A0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1430; --panel:#171E42; --ink:#E9ECF8; --muted:#9AA3C7; --line:#2C3566; --edge:#5F6BA5;
  --cobalt:#8EA0FF; --cobalt-ink:#0F1430; --weak:#FF8A75; --fair:#F2B544; --ok:#5FD6A0; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);
  font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

.shell{max-width:1120px;margin:0 auto;padding:28px 24px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:36px}
.mark{font-weight:800;font-size:clamp(40px,6vw,64px);line-height:.9;letter-spacing:-.045em;margin:0}
.mark a{color:inherit;text-decoration:none;border-radius:6px}
.mark a:hover span{transform:translateY(.06em) rotate(8deg)}
.mark span{transition:transform .2s ease;display:inline-block;transform:translateY(.06em) rotate(-8deg);color:var(--cobalt)}
.lede{margin:10px 0 0;color:var(--muted);max-width:46ch}
.theme{border:1px solid var(--edge);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;align-items:start}
.layout>*{min-width:0}
nav{position:sticky;top:24px;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:block;padding:10px 14px 11px;border-radius:10px;position:relative}
nav button b{display:block;font-weight:600;font-size:17px;letter-spacing:-.01em}
nav button small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
nav button:hover{background:var(--panel)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
nav button[aria-selected="true"] small{color:inherit;opacity:.7}
nav button[aria-selected="true"]::before{content:"";position:absolute;left:-10px;top:50%;width:6px;height:6px;
  margin-top:-3px;border-radius:50%;background:var(--tag)}
nav button:focus-visible{outline:2px solid var(--cobalt)}

main h2{font-weight:700;font-size:clamp(28px,3.4vw,38px);letter-spacing:-.03em;line-height:1.05;margin:0 0 6px}
main .about{color:var(--muted);margin:0 0 22px;max-width:60ch}

/* the key tag */
.tag{position:relative;background:var(--tag);color:var(--tag-ink);
  --cut:24px;border-radius:0 18px 18px 0;
  -webkit-mask:linear-gradient(135deg,transparent var(--cut),#000 0) top left/51% 51% no-repeat,linear-gradient(45deg,transparent var(--cut),#000 0) bottom left/51% 51% no-repeat,linear-gradient(#000,#000) right/50% 100% no-repeat;
          mask:linear-gradient(135deg,transparent var(--cut),#000 0) top left/51% 51% no-repeat,linear-gradient(45deg,transparent var(--cut),#000 0) bottom left/51% 51% no-repeat,linear-gradient(#000,#000) right/50% 100% no-repeat;padding:30px 30px 30px 78px;min-height:132px;display:flex;align-items:center}
.tag::before{content:"";position:absolute;left:26px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;
  background:var(--paper);box-shadow:inset 0 0 0 4px var(--tag-shade)}
.value{font-family:var(--mono);font-weight:500;font-size:clamp(20px,2.9vw,34px);line-height:1.35;letter-spacing:0;
  overflow-wrap:anywhere;white-space:pre-wrap;margin:0;width:100%;user-select:all;font-variant-ligatures:none}
.value.long{font-size:clamp(15px,1.9vw,21px)}
.value.xlong{font-size:clamp(13px,1.4vw,16px);line-height:1.55}
.value.err{font-family:var(--sans);font-size:18px;user-select:auto;word-break:normal}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}
.btn{border:1px solid var(--edge);background:var(--panel);border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[hidden]{display:none}

.meter{display:flex;align-items:center;gap:14px;margin:22px 0 0;flex-wrap:wrap}
.bars{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:180px;flex:none}
.bars i{height:8px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--ink)}
.meter[data-level="weak"] .bars i.on{background:var(--weak)}
.meter[data-level="fair"] .bars i.on{background:var(--fair)}
.meter[data-level="strong"] .bars i.on{background:var(--ok)}
.bars i{transition:background-color .2s}
.meter p{margin:0;color:var(--muted);font-size:15px}
.meter p strong{color:var(--ink);font-weight:600}

.opts{margin:30px 0 0;padding:24px 0 0;border-top:1px solid var(--line);display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 28px}
.f{display:flex;flex-direction:column;gap:8px;min-width:0}
.f[hidden]{display:none}
.f>label,.f>.l{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.f>label output{font-family:var(--mono);font-weight:400;font-size:14px;color:var(--muted)}
.f input[type=range]{width:100%;accent-color:var(--cobalt);margin:4px 0}
.f select,.f input[type=text]{width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:9px 12px}
.f input[type=text]{font-family:var(--mono);font-size:14px}
.f select:focus,.f input[type=text]:focus{border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 25%,transparent)}
.f.wide{grid-column:1/-1}
.f textarea{width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;resize:vertical;font:400 15px/1.5 var(--sans);min-height:120px}
.f textarea:focus{border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 25%,transparent)}
nav .grp{display:block;color:var(--muted);font-size:13px;padding:14px 14px 4px}
nav .grp:first-child{padding-top:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
/* selection marker: a key-tag hole that becomes a yellow tag dot with a drawn tick */
.mk{flex:none;position:relative;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--edge);
  transition:background-color .16s ease,box-shadow .16s ease}
.mk svg{position:absolute;inset:0;width:16px;height:16px;fill:none;stroke:var(--tag-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:12;stroke-dashoffset:12;transition:stroke-dashoffset .22s ease .04s}
input:checked+span .mk{background:var(--tag);box-shadow:inset 0 0 0 1px var(--tag-shade)}
input:checked+span .mk svg{stroke-dashoffset:0}

.chk{position:relative}
.chk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chk span{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 7px;border:1px solid var(--edge);border-radius:999px;
  font-size:14px;color:var(--muted);background:transparent;transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}
.chk:hover span{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 55%,var(--edge))}
.chk input:checked+span{color:var(--ink);background:var(--panel);border-color:var(--ink);font-weight:600;box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 12%,transparent)}
.chk input:focus-visible+span{outline:2px solid var(--cobalt);outline-offset:2px}

.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.sty{position:relative;display:flex}
.sty input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sty span{position:relative;flex:1;display:flex;flex-direction:column;gap:4px;padding:11px 38px 12px 13px;border:1px solid var(--edge);border-radius:12px;
  background:transparent;transition:background-color .16s ease,border-color .16s ease,box-shadow .16s ease}
.sty .mk{position:absolute;top:12px;right:12px}
.sty b{font-weight:600;font-size:15px}
.sty code{font:400 12px/1.4 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sty small{font-size:13px;line-height:1.35;color:var(--muted)}
.sty:hover span{border-color:color-mix(in srgb,var(--ink) 55%,var(--edge))}
.sty input:checked+span{background:var(--panel);border-color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 10%,transparent),0 6px 18px -10px color-mix(in srgb,var(--ink) 35%,transparent)}
.sty input:checked+span code{color:var(--ink)}
.sty input:focus-visible+span{outline:2px solid var(--cobalt);outline-offset:2px}
@media (max-width:860px){.styles{grid-template-columns:1fr 1fr}}
.list{margin:28px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.list li{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:9px 0}
.list code{flex:1;min-width:0;font:400 14px/1.5 var(--mono);word-break:break-all;white-space:pre-wrap}
.list button{border:0;background:transparent;color:var(--cobalt);font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 -18px;color:var(--muted);font-size:15px}

.yours{margin:28px 0 0;padding:16px 18px;background:var(--panel);border-radius:12px;font-size:14px}
.yours p{margin:0 0 6px;color:var(--muted)}
.yours .row{display:flex;gap:12px;align-items:center}
.yours .row code{flex:1;min-width:0}
.yours button{border:0;background:transparent;color:var(--cobalt);font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px}
.yours code{font:400 13px/1.5 var(--mono);word-break:break-all}

footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer p{margin:0}
kbd{font:500 12px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel);color:var(--ink)}
footer a{color:inherit}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;transition:.18s ease;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .shell{padding:20px 16px 40px}
  header{margin-bottom:22px}
  .layout{grid-template-columns:minmax(0,1fr);gap:20px}
  nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:none;padding:8px 14px;border:1px solid var(--edge);border-radius:999px}
  nav button b{font-size:15px}
  nav button small{display:none}
  nav button[aria-selected="true"]{border-color:var(--ink)}
  nav button[aria-selected="true"]::before{display:none}
  nav .grp{display:none}
  .tag{padding:24px 18px 24px 62px;min-height:110px;--cut:18px}
  .tag::before{left:20px;width:18px;height:18px;margin-top:-9px}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1 class="mark"><a href="./" id="home" aria-label="rrandom, go to home">rrand<span>o</span>m</a></h1>
      <p class="lede">Passwords, keys and IDs made with your browser's cryptographic random generator. Nothing you generate leaves this page.</p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Toggle dark mode">Dark</button>
  </header>

  <div class="layout">
    <nav id="nav" role="tablist" aria-label="Generators"></nav>
    <main id="main"><div id="panel" role="tabpanel" tabindex="-1">
      <h2 id="title"></h2>
      <p class="about" id="about"></p>
      <div class="tag"><p class="value" id="value"></p></div><p class="sr-only" id="live" aria-live="polite"></p>
      <div class="actions">
        <button class="btn primary" id="gen" type="button">Generate</button>
        <button class="btn" id="copy" type="button">Copy</button>
        <button class="btn" id="copyAll" type="button" hidden>Copy all</button>
        <button class="btn" id="download" type="button" hidden>Download .txt</button>
      </div>
      <div class="meter" id="meter"><div class="bars" id="bars"></div><p id="meterText"></p></div>
      <form class="opts" id="opts" onsubmit="return false"></form>
      <div id="extra"></div>
    </div></main>
  </div>

  <footer>
    <p>Press <kbd>G</kbd> to generate, <kbd>C</kbd> to copy.</p>
    <p>Passphrase words from the <a href="https://www.eff.org/dice" rel="noopener">EFF wordlist</a>.</p>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ---------- randomness ---------- */
const cryptoObj = globalThis.crypto;
const R = {
  int(max){ // uniform integer in [0, max)
    if (max <= 1) return 0;
    const lim = Math.floor(0x100000000 / max) * max, b = new Uint32Array(1);
    for(;;){ cryptoObj.getRandomValues(b); if (b[0] < lim) return b[0] % max; }
  },
  bytes(n){ const a = new Uint8Array(n); cryptoObj.getRandomValues(a); return a; },
  pick(arr){ return arr[R.int(arr.length)]; },
  str(alpha, len){ const a = Array.isArray(alpha) ? alpha : [...alpha]; let s = ""; for (let i = 0; i < len; i++) s += a[R.int(a.length)]; return s; },
  shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = R.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; },
};
const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
const b64url = (b) => btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

const A = {
  lower: "abcdefghijklmnopqrstuvwxyz", upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", digits: "0123456789",
  symbols: "!@#$%^&*()-_=+[]{};:,.<>?/~",
  b62: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz",
  b64: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/",
  b32: "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567",
  grouped: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789",
  lookalike: "Il1O0o|`'\"",
};
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; } return t; })();
const crc32 = (str) => { let c = 0xFFFFFFFF; for (const x of new TextEncoder().encode(str)) c = CRC_T[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
const b32enc = (bytes) => { // RFC 4648 base32, no padding
  let val = 0, bits = 0, out = "";
  for (const x of bytes){ val = ((val << 8) | x) & 0xFFFF; bits += 8; while (bits >= 5){ out += A.b32[(val >>> (bits - 5)) & 31]; bits -= 5; } }
  if (bits > 0) out += A.b32[(val << (5 - bits)) & 31];
  return out;
};
const toB62 = (n, w) => { let s = ""; do { s = A.b62[n % 62] + s; n = Math.floor(n / 62); } while (n > 0); return s.padStart(w, "0"); };

/* ---------- formatting ---------- */
const BIG = [[1e18,"quintillion"],[1e15,"quadrillion"],[1e12,"trillion"],[1e9,"billion"],[1e6,"million"]];
function bigNum(log10){
  if (log10 >= 21) return "10^" + Math.round(log10);
  const n = Math.pow(10, log10);
  for (const [v, w] of BIG) if (n >= v) return (n / v).toFixed(n / v < 10 ? 1 : 0).replace(/\.0$/, "") + " " + w;
  return Math.round(n).toLocaleString("en-US");
}
function crackTime(bits){ // average guesses = 2^(bits-1) at 10^12 guesses per second
  const secLog10 = (bits - 1) * Math.LOG10E * Math.LN2 - 12;
  const units = [[0,"seconds",1],[Math.log10(60),"minutes",60],[Math.log10(3600),"hours",3600],[Math.log10(86400),"days",86400],[Math.log10(31557600),"years",31557600]];
  if (secLog10 < 0) return "instantly";
  if (secLog10 > Math.log10(31557600) + 10.14) return "longer than the universe has existed";
  let u = units[0]; for (const x of units) if (secLog10 >= x[0]) u = x;
  const v = Math.pow(10, secLog10) / u[2];
  if (u[1] === "years" && v >= 1e6) return "about " + bigNum(Math.log10(v)) + " years";
  return "about " + Math.max(1, Math.round(v)).toLocaleString("en-US") + " " + u[1];
}
function strength(bits){
  if (bits < 45) return ["weak", "Weak"];
  if (bits < 64) return ["fair", "Fair"];
  if (bits < 90) return ["strong", "Strong"];
  return ["strong", "Very strong"];
}
const entropyMeta = (bits) => { const [lvl, word] = strength(bits); return { bits, level: lvl,
  html: `<strong>${word}</strong>, ${Math.floor(bits)} bits of entropy. Cracking would take ${crackTime(bits)} at a trillion guesses per second.` }; };

/* ---------- user agent versions ---------- */
function uaVersions(){
  const v = globalThis.RR_UA || {}, now = Date.now(), cycle = 28 * 864e5;
  const since = (date) => { const t = Date.parse(date); return Number.isFinite(t) ? Math.max(0, Math.floor((now - t) / cycle)) : null; };
  // Last known versions, used when versions.js is missing or a field is unusable.
  const BASE = { chrome:["158.0.8127.37","2026-11-03"], firefox:["160.0","2026-11-10"], edge:["157.0.4341.60","2026-11-06"] };
  const checked = since(v.updated);
  let estimated = false;
  const resolve = (k) => {
    let ver = String(v[k] || ""), drift = checked;
    if (!(parseInt(ver, 10) > 0) || drift === null){ ver = BASE[k][0]; drift = since(BASE[k][1]) || 0; estimated = true; }
    const parts = ver.split(".").map((x) => parseInt(x, 10) || 0), major = parts[0] + drift;
    // Exact builds are unknown after drifting; Chromium builds advance roughly 80 per release.
    return { major, full: drift ? `${major}.0.${parts[2] ? parts[2] + drift * 80 : 0}.${parts[2] ? 100 : 0}` : ver };
  };
  const c = resolve("chrome"), f = resolve("firefox"), e = resolve("edge");
  const d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1;
  const safariEst = `${m >= 9 ? y - 1999 : y - 2000}.${Math.min(6, Math.floor((m >= 9 ? m - 9 : m + 3) / 2))}`;
  const safari = checked !== null && checked <= 4 && /^\d+\.\d+$/.test(String(v.safari)) ? String(v.safari) : safariEst;
  const source = estimated ? (checked !== null ? `Versions checked ${v.updated}; missing ones estimated from release schedules.` : "Versions estimated from each browser's release schedule.")
    : checked ? `Based on versions checked ${v.updated}, adjusted for releases since.` : `Browser versions checked ${v.updated}.`;
  return { chrome:c.major, chromeFull:c.full, firefox:f.major, edge:e.major, edgeFull:e.full, safari, source };
}
const UA_MATRIX = { chrome:["windows","mac","linux","android","ios"], firefox:["windows","mac","linux","android","ios"], edge:["windows","mac","linux","android","ios"], safari:["mac","ios"] };

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem("rr:" + k)); } catch { return null; } },
  set(k, v){ try { localStorage.setItem("rr:" + k, JSON.stringify(v)); } catch {} },
};
function defaults(tool){
  const s = {};
  for (const f of tool.fields){
    if (f.type === "checks") for (const [k,, d] of f.items) s[k] = d;
    else s[f.key] = f.def;
  }
  return s;
}
const states = {};
// Saved settings may come from an older version of the page; keep only values that are still valid.
function sanitize(tool, saved){
  const s = defaults(tool);
  if (!saved || typeof saved !== "object") return s;
  for (const f of tool.fields){
    if (f.type === "checks"){ for (const [k] of f.items) if (typeof saved[k] === "boolean") s[k] = saved[k]; continue; }
    const v = saved[f.key];
    if (f.type === "range"){
      const n = Number(v), step = f.step || 1;
      if (Number.isFinite(n)) s[f.key] = Math.min(f.max, Math.max(f.min, f.min + Math.round((n - f.min) / step) * step));
    } else if (f.type === "select" || f.type === "styles"){
      if (f.options.some((o) => o[0] === v)) s[f.key] = v;
    } else if (typeof v === "string") s[f.key] = v.slice(0, 20000);
  }
  return s;
}
TOOLS.forEach((t) => { states[t.id] = sanitize(t, store.get(t.id)); });

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const el = { nav:$("nav"), title:$("title"), about:$("about"), value:$("value"), opts:$("opts"), bars:$("bars"),
  meter:$("meter"), meterText:$("meterText"), extra:$("extra"), copyAll:$("copyAll"), download:$("download"), toast:$("toast") };
el.bars.innerHTML = "<i></i>".repeat(10);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

let current = TOOLS[0], results = [], animId = 0;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

el.nav.innerHTML = TOOLS.map((t, i) => (i === 0 || TOOLS[i - 1].group !== t.group ? `<span class="grp" role="presentation">${t.group}</span>` : "") + `<button type="button" role="tab" id="tab-${t.id}" data-id="${t.id}" aria-selected="false" aria-controls="panel"><b>${t.name}</b><small>${t.sub}</small></button>`).join("");
el.nav.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) select(b.dataset.id, true); });
el.nav.addEventListener("keydown", (e) => {
  if (!["ArrowDown","ArrowUp","ArrowLeft","ArrowRight","Home","End"].includes(e.key)) return;
  e.preventDefault();
  const i = TOOLS.indexOf(current), d = e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1;
  const next = e.key === "Home" ? TOOLS[0] : e.key === "End" ? TOOLS[TOOLS.length - 1] : TOOLS[(i + d + TOOLS.length) % TOOLS.length];
  select(next.id, true); $("tab-" + next.id).focus();
});

function renderFields(){
  const s = states[current.id];
  el.opts.innerHTML = current.fields.map((f, i) => {
    const id = `f-${current.id}-${i}`;
    if (f.type === "range") return `<div class="f" data-i="${i}"><label for="${id}">${f.label}<output id="${id}-o">${s[f.key]}</output></label>
      <input type="range" id="${id}" data-key="${f.key}" min="${f.min}" max="${f.max}" step="${f.step || 1}" value="${s[f.key]}"></div>`;
    if (f.type === "select") return `<div class="f" data-i="${i}"><label for="${id}">${f.label}</label><select id="${id}" data-key="${f.key}">
      ${f.options.map(([v, l]) => `<option value="${esc(v)}"${v === s[f.key] ? " selected" : ""}>${l}</option>`).join("")}</select></div>`;
    if (f.type === "text") return `<div class="f" data-i="${i}"><label for="${id}">${f.label}</label>
      <input type="text" id="${id}" data-key="${f.key}" value="${esc(s[f.key])}" spellcheck="false" autocomplete="off"></div>`;
    if (f.type === "textarea") return `<div class="f wide" data-i="${i}"><label for="${id}">${f.label}</label>
      <textarea id="${id}" data-key="${f.key}" rows="6" spellcheck="false">${esc(s[f.key])}</textarea></div>`;
    if (f.type === "styles") return `<div class="f wide" data-i="${i}" role="radiogroup" aria-label="${f.label}"><span class="l">${f.label}</span><div class="styles">
      ${f.options.map(([v, name, ex, note]) => `<label class="sty"><input type="radio" name="${id}" data-key="${f.key}" value="${esc(v)}"${v === s[f.key] ? " checked" : ""}>
        <span><i class="mk" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4.6 8.3l2.3 2.3 4.5-4.9"/></svg></i><b>${name}</b><code>${esc(ex)}</code><small>${note}</small></span></label>`).join("")}</div></div>`;
    if (f.type === "checks") return `<div class="f" data-i="${i}" role="group" aria-label="${f.label}"><span class="l">${f.label}</span><div class="checks">
      ${f.items.map(([k, l]) => `<label class="chk"><input type="checkbox" data-key="${k}"${s[k] ? " checked" : ""}><span><i class="mk" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4.6 8.3l2.3 2.3 4.5-4.9"/></svg></i>${l}</span></label>`).join("")}</div></div>`;
  }).join("");
  syncVisibility();
}
function syncVisibility(){
  const s = states[current.id];
  el.opts.querySelectorAll(".f").forEach((n) => { const f = current.fields[n.dataset.i]; n.hidden = f.show ? !f.show(s) : false; });
}
el.opts.addEventListener("input", (e) => {
  const t = e.target, k = t.dataset.key; if (!k) return;
  const s = states[current.id];
  s[k] = t.type === "checkbox" ? t.checked : t.type === "range" ? +t.value : t.value;
  if (t.type === "range") $(t.id + "-o").textContent = t.value;
  store.set(current.id, s);
  syncVisibility();
  if (t.tagName === "TEXTAREA"){ renderMeta(); return; } // redraw only when the person presses Generate
  generate(!(t.type === "range" || t.type === "text"));
});

function select(id, push){
  const found = TOOLS.find((t) => t.id === id);
  current = found || TOOLS[0];
  el.nav.querySelectorAll("button").forEach((b) => { const on = b.dataset.id === current.id; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
  $("panel").setAttribute("aria-labelledby", "tab-" + current.id);
  $("tab-" + current.id).scrollIntoView({ block:"nearest", inline:"nearest" });
  el.title.textContent = current.name; el.about.textContent = current.about;
  document.title = `${current.name} generator | rrandom`;
  if ((push || (!found && location.hash)) && location.hash !== "#" + current.id) history.replaceState(null, "", "#" + current.id);
  results = []; ctxOf.delete(current); renderList();
  renderFields();
  generate(true);
}

function sizeClass(v){ return v.length > 90 ? "xlong" : v.length > 44 ? "long" : ""; }
function showValue(v, animate){
  const n = el.value; n.className = "value " + sizeClass(v) + (current.plain ? " plain" : "");
  const id = ++animId;
  if (!animate || reduceMotion.matches || v.length > 160){ n.textContent = v; return; }
  if (current.plain){ // raffle: flick through list items, slowing down, then land on the result
    let pool; try { pool = current.list(states[current.id]); } catch { pool = [v]; }
    let step = 0; const tick = () => {
      if (id !== animId) return;
      if (step++ > 9){ n.textContent = v; return; }
      n.textContent = R.pick(pool); setTimeout(tick, 30 + step * step * 4);
    };
    tick(); return;
  }
  const chars = [...new Set(v.replace(/\s/g, ""))]; const start = performance.now(), dur = 380;
  const frame = (t) => {
    if (id !== animId) return;
    const p = Math.max(0, Math.min(1, (t - start) / dur)), cut = Math.floor(p * v.length);
    let out = v.slice(0, cut);
    for (let i = cut; i < v.length; i++) out += /\s/.test(v[i]) ? v[i] : chars[(Math.random() * chars.length) | 0];
    n.textContent = out;
    if (p < 1) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
function showError(msg){ ++animId; el.value.className = "value err"; el.value.textContent = msg; results = []; }

function renderMeta(){
  const s = states[current.id];
  let m; try { m = current.meta(s); } catch { m = null; }
  el.meter.hidden = !m;
  if (!m) return;
  el.bars.hidden = m.level === "none";
  el.meter.dataset.level = m.level;
  const on = Math.max(1, Math.min(10, Math.round(m.bits / 12.8)));
  [...el.bars.children].forEach((b, i) => b.classList.toggle("on", i < on));
  el.meterText.innerHTML = m.html;
}

let genSeq = 0;
const ctxOf = new Map(); // per-tool context from the latest finished run (JWT secret, etc.)
async function generate(animate = true){
  const seq = ++genSeq, tool = current, s = { ...states[tool.id] };
  const stale = () => seq !== genSeq || tool !== current;
  let words;
  if (tool.async){
    if (!globalThis.RR_WORDS){ results = []; renderList(); ++animId; el.value.className = "value err"; el.value.textContent = "Loading word list…"; }
    try { words = await loadWords(); }
    catch { if (!stale()){ showError("The word list didn't load. Check that words.js sits next to index.html, then press Generate."); renderMeta(); } return; }
    if (stale()) return;
  }
  let out, ctx;
  try {
    ctx = tool.before ? await tool.before(s) : undefined;
    if (stale()) return;
    out = await Promise.all(Array.from({ length:s.count || 1 }, () => tool.gen(s, words, ctx)));
  } catch (e){
    if (stale()) return;
    if (e instanceof GenError){ showError(e.message); el.meter.hidden = true; ctxOf.delete(tool); renderList(); return; }
    throw e;
  }
  if (stale()) return;
  results = out; ctxOf.set(tool, ctx);
  showValue(results[0], animate);
  $("live").textContent = results.length > 1 ? `${results.length} new values generated.` : `New ${tool.name.toLowerCase()} generated.`;
  renderMeta();
  renderList();
}
function renderList(){
  const many = results.length > 1;
  el.copyAll.hidden = !many; el.download.hidden = !many;
  let html = many ? `<div class="list-head"><span>${results.length - 1} more</span></div><ul class="list">${
    results.slice(1).map((r, i) => `<li><code>${esc(r)}</code><button type="button" data-i="${i + 1}">Copy</button></li>`).join("")}</ul>` : "";
  if (current.extra) html += current.extra(states[current.id], ctxOf.get(current));
  el.extra.innerHTML = html;
}
el.extra.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.copy) copy(b.dataset.copy); else if (b.dataset.i) copy(results[b.dataset.i]);
});

/* ---------- actions ---------- */
let toastT;
function toast(msg){ el.toast.textContent = msg; el.toast.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.toast.classList.remove("show"), 1400); }
async function copy(text, label = "Copied"){
  if (!text) return;
  let ok = true;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    t.remove();
  }
  toast(ok ? label : "Copy failed. Select the text and press Ctrl+C or Cmd+C.");
}
$("gen").addEventListener("click", () => generate(true));
$("copy").addEventListener("click", () => copy(results[0]));
el.copyAll.addEventListener("click", () => copy(results.join("\n"), `Copied ${results.length}`));
el.download.addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([results.join("\n") + "\n"], { type:"text/plain" }));
  const a = Object.assign(document.createElement("a"), { href:url, download:`${current.id}-${Date.now()}.txt` });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target.tagName;
  if (tag === "INPUT" && e.target.type === "text" || tag === "SELECT" || tag === "TEXTAREA") return;
  if (e.key === "g" || e.key === "G"){ e.preventDefault(); generate(true); }
  if (e.key === "c" || e.key === "C"){
    const sel = getSelection();
    if (!sel.toString() || el.value.contains(sel.anchorNode)){ e.preventDefault(); copy(results[0]); }
  }
});

/* ---------- theme ---------- */
const themeBtn = $("theme");
function isDark(){ const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function syncTheme(){ themeBtn.textContent = isDark() ? "Light" : "Dark"; themeBtn.setAttribute("aria-label", isDark() ? "Switch to light mode" : "Switch to dark mode"); }
try { const t = localStorage.getItem("rr:theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
themeBtn.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("rr:theme", next); } catch {}
  syncTheme();
});
syncTheme();

/* ---------- start ---------- */
window.addEventListener("hashchange", () => select(location.hash.slice(1), false));
// Logo goes home: first generator, clean URL, no reload.
$("home").addEventListener("click", (e) => {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // let "open in new tab" work
  e.preventDefault();
  history.replaceState(null, "", location.pathname + location.search);
  select(TOOLS[0].id, false);
  scrollTo({ top:0, behavior: reduceMotion.matches ? "auto" : "smooth" });
});
select(location.hash.slice(1) || "password", false);
// Warm the word list in idle time so the Passphrase tab opens instantly.
(globalThis.requestIdleCallback || ((f) => setTimeout(f, 1500)))(() => loadWords().catch(() => {}));
</script>
<script src="versions.js" async onload="current.id==='useragent'&&(renderMeta(),generate(false))"></script>
</body>
</html>
