# Deploys the site to GitHub Pages on every push to main.
# Once a week (and on manual runs) it first refreshes versions.js with the latest
# browser versions, commits the change, then deploys.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write # commit versions.js
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 20

      # Fails the run (and skips the deploy) if any version feed is unreachable,
      # so a broken versions.js is never published.
      - name: Refresh browser versions
        if: github.event_name != 'push'
        run: node scripts/update-ua.mjs

      - name: Commit versions.js
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- versions.js; then
            echo "versions.js unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update browser versions for user agents" -- versions.js
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
